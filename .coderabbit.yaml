# CodeRabbit Configuration File
# Documentation: https://docs.coderabbit.ai/guides/configure-coderabbit

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "develop"
  path_instructions:
    - path: "backend/**"
      instructions: |
        Ensure strict FinTech security: verify that balance deductions and transactions are atomic, 
        tokens and credentials are authenticated via JWT middleware, and no sensitive financial data is logged.
    - path: "frontend/**"
      instructions: |
        Ensure responsive design, clean component modularity, proper error boundaries, 
        and strict zero-dark-pattern compliance across checkout and user account views.
chat:
  auto_reply: true

